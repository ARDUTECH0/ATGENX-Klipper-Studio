name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Klipper Studio version, placeholder: 1.0.0-beta.1}
    validations: {required: true}
  - type: input
    id: board
    attributes: {label: Board, placeholder: BIGTREETECH Octopus V1.1}
  - type: input
    id: os
    attributes: {label: Operating system, placeholder: Windows 11 / Ubuntu 24.04 / macOS 15}
  - type: textarea
    id: what
    attributes: {label: What happened and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: diff
    attributes:
      label: Relevant Differences / Checks / Log output
      description: Remove serial numbers, IP addresses and API keys.
      render: text
