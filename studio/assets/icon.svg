<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Klipper Studio icon: a nozzle printing layers that are also settings sliders -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16325e"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#3b8eea"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d4e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb35c" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ff8a1f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="495" height="495" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- heatsink fins -->
  <rect x="214" y="58" width="84" height="12" rx="6" fill="#8b9bb0"/>
  <rect x="214" y="78" width="84" height="12" rx="6" fill="#8b9bb0"/>
  <!-- heater block + nozzle -->
  <rect x="190" y="98" width="132" height="62" rx="14" fill="url(#metal)"/>
  <path d="M222 160 H290 L270 200 H242 Z" fill="url(#metal)"/>
  <circle cx="256" cy="210" r="34" fill="url(#glow)"/>
  <circle cx="256" cy="206" r="8" fill="#ffb35c"/>

  <!-- layer 1: being printed (solid up to the nozzle, faint after it) -->
  <rect x="112" y="238" width="288" height="36" rx="18" fill="#3b8eea" fill-opacity="0.22"/>
  <path d="M130 238 H256 V274 H130 A18 18 0 0 1 130 238 Z" fill="url(#layer)"/>
  <!-- layer 2 -->
  <rect x="96" y="300" width="320" height="36" rx="18" fill="url(#layer)"/>
  <circle cx="186" cy="318" r="25" fill="#ffffff"/>
  <circle cx="186" cy="318" r="10" fill="#1f6feb"/>
  <!-- layer 3 -->
  <rect x="80" y="362" width="352" height="36" rx="18" fill="url(#layer)"/>
  <circle cx="336" cy="380" r="25" fill="#ffffff"/>
  <circle cx="336" cy="380" r="10" fill="#2ea043"/>
  <!-- build plate -->
  <rect x="64" y="424" width="384" height="16" rx="8" fill="#9aa7b8" fill-opacity="0.35"/>
</svg>
